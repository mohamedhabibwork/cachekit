name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
      - run: npm ci && npm run build
      - run: bun -e "import { createMemoryCache } from './dist/index.js'; const c=createMemoryCache(); await c.set('ok', true); if(await c.get('ok') !== true) process.exit(1)"
      - run: deno eval --allow-read "import { createMemoryCache } from './dist/index.js'; const c=createMemoryCache(); await c.set('ok', true); if(await c.get('ok') !== true) Deno.exit(1)"
